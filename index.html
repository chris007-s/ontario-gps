<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ontario Back-Road GPS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1219">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OntarioGPS">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a1f2e;color:#e8eaf0;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Header ── */
#header{padding:8px 12px;background:#0f1219;border-bottom:1px solid #252a3e;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
#header h1{font-size:13px;font-weight:700;color:#7eb8f7;white-space:nowrap}
#badge{background:#b91c1c;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px;white-space:nowrap}
.inp-wrap{display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center}
.addr-group{display:flex;gap:4px;flex:1;min-width:160px}
input[type=text]{flex:1;padding:6px 9px;background:#1a1f30;border:1px solid #333a58;border-radius:6px;color:#e8eaf0;font-size:12px;min-width:80px}
input[type=text]::placeholder{color:#4a5070}
input[type=text]:focus{outline:none;border-color:#7eb8f7}
button{padding:6px 11px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;transition:background .15s}
#btn-route{background:#2563eb;color:#fff}
#btn-route:hover{background:#1d4ed8}
#btn-clear{background:#374151;color:#e8eaf0}
#btn-clear:hover{background:#4b5563}
.icon-btn{background:#374151;color:#e8eaf0;padding:6px 8px;font-size:14px}
.icon-btn:hover{background:#4b5563}
.icon-btn.active{background:#7c3aed;color:#fff}
#btn-drive{background:#16a34a;color:#fff;font-size:12px;padding:6px 12px}
#btn-drive:hover{background:#15803d}
#btn-drive.tracking{background:#dc2626}
#btn-drive.tracking:hover{background:#b91c1c}

/* ── Status bar ── */
#status{padding:5px 12px;font-size:11px;background:#0a0d15;color:#7a80a0;border-bottom:1px solid #1e2335;flex-shrink:0;min-height:24px;display:flex;align-items:center;gap:8px}
#gps-dot{width:8px;height:8px;border-radius:50%;background:#4b5563;flex-shrink:0;transition:background .3s}
#gps-dot.active{background:#22c55e;box-shadow:0 0 6px #22c55e88;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Main layout ── */
#main{flex:1;position:relative;display:flex;overflow:hidden}
#map{flex:1}

/* ── Live HUD overlay ── */
#hud{position:absolute;top:10px;left:10px;z-index:1000;display:none;flex-direction:column;gap:6px;pointer-events:none}
#hud-turn{background:#0f1219ee;border:1px solid #252a3e;border-radius:10px;padding:10px 14px;min-width:200px;pointer-events:auto}
#hud-arrow{font-size:40px;line-height:1;margin-bottom:2px}
#hud-street{font-size:16px;font-weight:700;color:#fff}
#hud-detail{font-size:11px;color:#7a80a0;margin-top:1px}
#hud-dist-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
#hud-in{font-size:24px;font-weight:700;color:#7eb8f7}
#hud-total{font-size:11px;color:#5a6080;text-align:right}
#hud-lane{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.h-lane{font-size:14px;padding:2px 5px;border-radius:4px;background:#1e2335}
.h-lane.valid{background:#2563eb;color:#fff}
#hud-speed{background:#0f1219ee;border:1px solid #252a3e;border-radius:8px;padding:6px 10px;display:flex;align-items:baseline;gap:4px;pointer-events:none}
#hud-spd-val{font-size:22px;font-weight:700;color:#4ade80}
#hud-spd-unit{font-size:10px;color:#5a6080}
#hud-next{background:#0f1219cc;border:1px solid #252a3e;border-radius:8px;padding:7px 10px;font-size:11px;color:#9aa0c0;pointer-events:none;display:none}
#hud-next strong{color:#e8eaf0}

/* ── Off-route banner ── */
#offroute-banner{position:absolute;top:0;left:0;right:0;z-index:2000;background:#dc2626;color:#fff;font-size:12px;font-weight:700;text-align:center;padding:6px;display:none;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.7}}

/* ── Voice indicator ── */
#voice-indicator{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#7c3aed;color:#fff;font-size:11px;font-weight:600;padding:4px 14px;border-radius:20px;z-index:2000;display:none;pointer-events:none}

/* ── Side panel ── */
#side{width:270px;background:#0f1219;border-left:1px solid #252a3e;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
#tabs{display:flex;border-bottom:1px solid #252a3e;flex-shrink:0}
.tab{flex:1;padding:8px 4px;text-align:center;font-size:11px;font-weight:600;color:#5a6080;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:#7eb8f7;border-bottom-color:#7eb8f7}
.tab-content{flex:1;overflow-y:auto;padding:10px}
.tab-content.hidden{display:none}

/* ── Nav box ── */
#nav-box{background:#12151f;border:1px solid #252a3e;border-radius:10px;padding:11px;margin-bottom:8px;display:none}
#nav-direction{font-size:26px;margin-bottom:2px;line-height:1}
#nav-street{font-size:14px;font-weight:600;color:#e8eaf0;margin-bottom:1px}
#nav-detail{font-size:10px;color:#7a80a0}
#nav-dist{font-size:18px;font-weight:700;color:#7eb8f7;text-align:right}
#nav-row{display:flex;align-items:center;justify-content:space-between}
#nav-lane{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;align-items:center}
.lane-arrow{font-size:14px;padding:2px 5px;border-radius:4px;background:#1e2335}
.lane-arrow.valid{background:#1d4ed8;color:#fff}

/* ── Steps list ── */
#summary{background:#1a2540;border-radius:6px;padding:7px 10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
#summary .stat{text-align:center}
#summary .stat-val{font-size:15px;font-weight:700;color:#7eb8f7}
#summary .stat-lbl{font-size:10px;color:#5a6080}
.step{display:flex;gap:7px;align-items:flex-start;padding:6px 2px;border-bottom:1px solid #1a1f30;cursor:pointer}
.step:last-child{border:none}
.step:hover{background:#1a2030;border-radius:5px}
.step.active-step{background:#1a2540;border-radius:6px;border-left:2px solid #3b82f6;padding-left:6px}
.step.done-step{opacity:.4}
.step-icon{width:24px;height:24px;border-radius:5px;background:#1d3a6e;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.step-body{flex:1;min-width:0}
.step-text{color:#c8d0e0;line-height:1.4;font-size:11px;word-break:break-word}
.step-meta{display:flex;gap:5px;margin-top:2px;flex-wrap:wrap;align-items:center}
.step-dist{color:#5a7090;font-size:10px}
.step-road{color:#7eb8f7;font-size:10px;background:#1a2540;padding:1px 5px;border-radius:3px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-lane-mini{font-size:10px;color:#a78bfa}

/* ── Favourites ── */
.fav-item{display:flex;align-items:center;gap:6px;padding:7px 4px;border-bottom:1px solid #1a1f30}
.fav-info{flex:1;min-width:0}
.fav-name{font-size:12px;font-weight:600;color:#e8eaf0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-addr{font-size:10px;color:#5a7090;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-del{background:none;border:none;color:#4b5563;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:3px}
.fav-del:hover{color:#ef4444;background:#2a1515}
.fav-use{background:#1d3a6e;border:none;color:#7eb8f7;cursor:pointer;font-size:10px;padding:3px 7px;border-radius:4px;white-space:nowrap}
.fav-use:hover{background:#2563eb;color:#fff}
#fav-save-area{padding:8px 0;border-bottom:1px solid #1a1f30;margin-bottom:8px;display:none}
#fav-save-area input{width:100%;margin-bottom:6px}
.fav-btn-row{display:flex;gap:6px}
#btn-save-fav{background:#16a34a;color:#fff;flex:1}
#btn-cancel-fav{background:#374151;color:#e8eaf0;flex:1}
#btn-open-save{background:#1e3a1e;color:#4ade80;border:1px solid #1a4a1a;font-size:11px;padding:6px 10px;border-radius:5px;cursor:pointer;width:100%;margin-bottom:4px;display:none}
#btn-open-save:hover{background:#14532d}
#no-favs{color:#4a5070;font-size:12px;text-align:center;padding:20px 0}

/* ── User position marker ── */
.pos-dot{width:18px;height:18px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 4px #3b82f640}
.pos-arrow{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:20px solid #3b82f6;filter:drop-shadow(0 1px 3px #0006);transform-origin:center bottom}

.leaflet-container{background:#1a1f2e}
</style>
</head>
<body>

<div id="header">
  <h1>🗺 Ontario GPS</h1>
  <span id="badge">NO 400-SERIES</span>
  <div class="inp-wrap">
    <div class="addr-group">
      <input type="text" id="from" placeholder="From — address or 📍"/>
      <button class="icon-btn" id="btn-locate" title="Use my GPS">📍</button>
    </div>
    <div class="addr-group">
      <input type="text" id="to" placeholder="To — address"/>
    </div>
    <button id="btn-route">Route</button>
    <button id="btn-drive">▶ Drive</button>
    <button id="btn-clear">Clear</button>
    <button class="icon-btn" id="btn-voice" title="Toggle voice">🔇</button>
  </div>
</div>

<div id="status">
  <span id="gps-dot"></span>
  <span id="status-text">Click map to set start (A) then end (B), or type addresses and click Route.</span>
</div>

<div id="main">
  <div id="map"></div>
  <div id="offroute-banner">⚠ Off route — recalculating…</div>
  <div id="voice-indicator">🔊 Speaking…</div>

  <!-- Live HUD -->
  <div id="hud">
    <div id="hud-turn">
      <div id="hud-arrow">⬆</div>
      <div id="hud-street">—</div>
      <div id="hud-detail"></div>
      <div id="hud-dist-row">
        <div id="hud-in">—</div>
        <div id="hud-total"></div>
      </div>
      <div id="hud-lane"></div>
    </div>
    <div style="display:flex;gap:6px">
      <div id="hud-speed"><span id="hud-spd-val">0</span><span id="hud-spd-unit">km/h</span></div>
      <div id="hud-next"></div>
    </div>
  </div>

  <!-- Side panel -->
  <div id="side">
    <div id="tabs">
      <div class="tab active" data-tab="directions">Directions</div>
      <div class="tab" data-tab="favourites">⭐ Favs</div>
    </div>

    <div id="tab-directions" class="tab-content">
      <div id="nav-box">
        <div id="nav-row">
          <div>
            <div id="nav-direction">⬆</div>
            <div id="nav-street">—</div>
            <div id="nav-detail"></div>
          </div>
          <div id="nav-dist">—</div>
        </div>
        <div id="nav-lane"></div>
      </div>
      <div id="summary" style="display:none">
        <div class="stat"><div class="stat-val" id="s-dist">—</div><div class="stat-lbl">km</div></div>
        <div class="stat"><div class="stat-val" id="s-time">—</div><div class="stat-lbl">est. time</div></div>
        <div class="stat"><div class="stat-val" id="s-turns">—</div><div class="stat-lbl">turns</div></div>
      </div>
      <div id="steps"></div>
    </div>

    <div id="tab-favourites" class="tab-content hidden">
      <div id="fav-save-area">
        <input type="text" id="fav-name-input" placeholder="Name this route…"/>
        <div class="fav-btn-row">
          <button id="btn-save-fav">Save</button>
          <button id="btn-cancel-fav">Cancel</button>
        </div>
      </div>
      <button id="btn-open-save">⭐ Save route as favourite</button>
      <div id="fav-list"><div id="no-favs">No favourites yet.<br>Route somewhere and save it!</div></div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  CONSTANTS & STATE
// ═══════════════════════════════════════
const OFFROUTE_THRESHOLD = 60;   // metres before recalc
const STEP_ARRIVE_THRESHOLD = 35; // metres to advance to next step
const REROUTE_COOLDOWN = 8000;   // ms between rerouts
const GH_KEY = 'LijBPDQGfu7Iiq80ebFCtmgpph68QGC2WSGdOXFk';

let startLatLng=null, endLatLng=null;
let startMarker=null, endMarker=null, routeLayer=null;
let clickState=0;
let currentRoute=null;
let activeStepIdx=0;
let voiceOn=false;
let favourites=[];

// Live tracking
let watchId=null;
let isTracking=false;
let posMarker=null;
let posHeading=0;
let lastReroute=0;
let distTravelled=0;
let lastPos=null;

// ═══════════════════════════════════════
//  MAP
// ═══════════════════════════════════════
const map = L.map('map',{zoomControl:true}).setView([43.72,-79.4],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19
}).addTo(map);

function makeIcon(color,label){
  return L.divIcon({className:'',
    html:`<div style="background:${color};width:28px;height:28px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;box-shadow:0 2px 8px #0009">${label}</div>`,
    iconSize:[28,28],iconAnchor:[14,14]});
}
function posIcon(heading){
  return L.divIcon({className:'',
    html:`<div style="width:20px;height:20px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 4px #3b82f640,0 2px 8px #0008"></div>`,
    iconSize:[20,20],iconAnchor:[10,10]});
}

// ═══════════════════════════════════════
//  STATUS
// ═══════════════════════════════════════
function setStatus(msg,color='#7a80a0'){
  document.getElementById('status-text').style.color=color;
  document.getElementById('status-text').textContent=msg;
}

// ═══════════════════════════════════════
//  ROUTING
// ═══════════════════════════════════════
async function getRoute(start,end){
  setStatus('Calculating highway-free route…','#7eb8f7');
  const url=new URL('https://graphhopper.com/api/1/route');
  url.searchParams.set('key',GH_KEY);
  url.searchParams.append('point',`${start.lat},${start.lng}`);
  url.searchParams.append('point',`${end.lat},${end.lng}`);
  url.searchParams.set('profile','car');
  url.searchParams.set('avoid','MOTORWAY|TRUNK');
  url.searchParams.set('points_encoded','false');
  url.searchParams.set('instructions','true');
  url.searchParams.set('locale','en');
  url.searchParams.set('details','road_class,lanes');
  try{
    const r=await fetch(url.toString(),{signal:AbortSignal.timeout(15000)});
    if(!r.ok) throw new Error('GH '+r.status);
    const d=await r.json();
    if(d.message) throw new Error(d.message);
    return parseGH(d);
  }catch(e){
    console.warn('GH failed:',e.message);
    return await getRouteOSRM(start,end);
  }
}

function parseGH(data){
  const path=data.paths[0];
  const coords=path.points.coordinates.map(c=>[c[1],c[0]]);
  const laneDetail=(data.paths[0].details||{}).lanes||[];
  const rcDetail=(data.paths[0].details||{}).road_class||[];
  function getLanesAt(i){for(const s of laneDetail){if(i>=s[0]&&i<s[1])return s[2];}return null;}
  function getRCAt(i){for(const s of rcDetail){if(i>=s[0]&&i<s[1])return s[2]||'';}return '';}
  const steps=(path.instructions||[]).map(s=>({
    text:s.text||'Continue',distance:s.distance||0,sign:s.sign||0,
    streetName:s.street_name||s.name||'',exitNumber:s.exit_number||null,
    laneInfo:getLanesAt(s.interval?.[0]||0),
    roadType:getRCAt(s.interval?.[0]||0),
    interval:s.interval||[0,0],
    pointIndex:s.interval?.[0]||0
  }));
  return{coords,steps,distance:path.distance,duration:path.time/1000,source:'GH'};
}

async function getRouteOSRM(start,end){
  const url=`https://router.project-osrm.org/route/v1/driving/${start.lng},${start.lat};${end.lng},${end.lat}?steps=true&geometries=geojson&overview=full`;
  const r=await fetch(url,{signal:AbortSignal.timeout(15000)});
  if(!r.ok) throw new Error('OSRM '+r.status);
  const d=await r.json();
  if(d.code!=='Ok') throw new Error('No route found');
  const route=d.routes[0];
  const coords=route.geometry.coordinates.map(c=>[c[1],c[0]]);
  let ptIdx=0;
  const steps=route.legs.flatMap(leg=>leg.steps.map(s=>{
    const i=ptIdx; ptIdx+=s.geometry?.coordinates?.length||1;
    return{text:fmtOSRM(s),distance:s.distance,sign:modToSign(s.maneuver.modifier),
      streetName:s.name||'',exitNumber:null,laneInfo:null,roadType:'',interval:[i,i],pointIndex:i};
  }));
  return{coords,steps,distance:route.distance,duration:route.duration,source:'OSRM',fallback:true};
}

function fmtOSRM(s){
  const mod=s.maneuver.modifier||'';
  const type=s.maneuver.type;
  const name=s.name||'the road';
  if(type==='depart') return `Head ${bearingWord(s.maneuver.bearing_after)} on ${name}`;
  if(type==='arrive') return 'You have arrived at your destination';
  if(type==='turn') return `Turn ${mod} onto ${name}`;
  if(type==='roundabout') return `At the roundabout, take exit ${s.maneuver.exit||''} onto ${name}`;
  return `${type} ${mod} onto ${name}`.trim();
}
function bearingWord(b){
  if(b===undefined) return '';
  if(b<23||b>=338) return 'north'; if(b<68) return 'northeast';
  if(b<113) return 'east'; if(b<158) return 'southeast';
  if(b<203) return 'south'; if(b<248) return 'southwest';
  if(b<293) return 'west'; return 'northwest';
}
function modToSign(m){
  const map={uturn:-6,'sharp left':-3,left:-2,'slight left':-1,'slight right':1,right:2,'sharp right':3};
  return map[m]||0;
}

// ═══════════════════════════════════════
//  ARROWS / SPEECH
// ═══════════════════════════════════════
function signArrow(s){
  return {'-6':'↩','-3':'⬅','-2':'↰','-1':'↖','0':'⬆','1':'↗','2':'↱','3':'➡','4':'🏁','5':'📌','6':'↪'}[String(s)]||'⬆';
}
function signSpeak(s){
  return {'-6':'Make a U-turn','-3':'Turn sharp left','-2':'Turn left','-1':'Keep slight left',
          '0':'Continue straight','1':'Keep slight right','2':'Turn right','3':'Turn sharp right',
          '4':'You have arrived','5':'Waypoint reached','6':'Make a U-turn'}[String(s)]||'Continue';
}

function renderLanesHTML(laneInfo,cls='lane-arrow'){
  if(!laneInfo) return '';
  if(Array.isArray(laneInfo)){
    return laneInfo.map(l=>{
      const v=l.valid||l.active;
      const ind=(l.indications||[]).map(i=>({straight:'⬆',left:'↰',right:'↱','sharp left':'⬅',
        'sharp right':'➡','slight left':'↖','slight right':'↗',uturn:'↩'}[i]||'⬆')).join('');
      return`<span class="${cls}${v?' valid':''}">${ind||'⬆'}</span>`;
    }).join('');
  }
  if(typeof laneInfo==='number'&&laneInfo>0)
    return`<span style="font-size:10px;color:#a78bfa">${laneInfo} lanes</span>`;
  return '';
}

function fmtRoadType(rt){
  return {primary:'Primary road',secondary:'Secondary road',tertiary:'Local road',
    residential:'Residential',service:'Service road',trunk:'Trunk road',
    motorway:'Motorway',unclassified:'Unclassified',living_street:'Living street'}[rt]||rt||'';
}

// ═══════════════════════════════════════
//  VOICE
// ═══════════════════════════════════════
function speakStep(s,prefix=''){
  if(!voiceOn||!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const dist=s.distance>=1000?(s.distance/1000).toFixed(1)+' kilometres':(Math.round(s.distance)+' metres');
  let txt=prefix+signSpeak(s.sign);
  if(s.streetName&&s.sign!==4) txt+=` onto ${s.streetName}`;
  if(s.distance>0&&s.sign!==4) txt+=`, then continue for ${dist}`;
  if(s.exitNumber) txt+=`. Take exit ${s.exitNumber}`;
  if(s.laneInfo&&Array.isArray(s.laneInfo)){
    const vc=s.laneInfo.filter(l=>l.valid||l.active).length;
    if(vc) txt+=`. Use the ${s.sign<0?'left':'right'} ${vc===1?'lane':`${vc} lanes`}`;
  }
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='en-CA'; u.rate=1.05; u.pitch=1.0;
  u.onstart=()=>document.getElementById('voice-indicator').style.display='block';
  u.onend=u.onerror=()=>document.getElementById('voice-indicator').style.display='none';
  window.speechSynthesis.speak(u);
}

document.getElementById('btn-voice').addEventListener('click',()=>{
  voiceOn=!voiceOn;
  const btn=document.getElementById('btn-voice');
  btn.textContent=voiceOn?'🔊':'🔇';
  btn.classList.toggle('active',voiceOn);
  setStatus(voiceOn?'Voice ON — will narrate every turn.':'Voice OFF.','#a78bfa');
  if(voiceOn&&currentRoute) speakStep(currentRoute.steps[activeStepIdx]);
  else window.speechSynthesis?.cancel();
});

// ═══════════════════════════════════════
//  DRAW ROUTE
// ═══════════════════════════════════════
function drawRoute(result){
  currentRoute=result; activeStepIdx=0; distTravelled=0;
  if(routeLayer) map.removeLayer(routeLayer);
  routeLayer=L.polyline(result.coords,{
    color:result.fallback?'#f59e0b':'#3b82f6',weight:6,opacity:.88,
    dashArray:result.fallback?'10,7':null
  }).addTo(map);
  if(!isTracking) map.fitBounds(routeLayer.getBounds(),{padding:[40,60]});

  const km=(result.distance/1000).toFixed(1);
  const mins=Math.round(result.duration/60);
  const hrs=Math.floor(mins/60); const rem=mins%60;
  const timeStr=hrs>0?`${hrs}h ${rem}m`:`${mins}m`;
  const warn=result.fallback?' ⚠ Fallback':'';
  setStatus(`✅ ${km} km · ${timeStr}${warn}`, result.fallback?'#f59e0b':'#4ade80');

  document.getElementById('s-dist').textContent=km;
  document.getElementById('s-time').textContent=timeStr;
  document.getElementById('s-turns').textContent=result.steps.filter(s=>Math.abs(s.sign)>=1&&s.sign!==4).length;
  document.getElementById('summary').style.display='flex';

  renderSteps();
  updateNavBox(0);
  renderFavSaveBtn();
  switchTab('directions');
  if(voiceOn&&result.steps.length) speakStep(result.steps[0]);
}

function renderSteps(){
  if(!currentRoute) return;
  document.getElementById('steps').innerHTML=currentRoute.steps.map((s,i)=>{
    const dist=s.distance>=1000?(s.distance/1000).toFixed(1)+' km':(Math.round(s.distance)+' m');
    const road=s.streetName?`<span class="step-road">${s.streetName}</span>`:'';
    const lm=s.laneInfo&&Array.isArray(s.laneInfo)&&s.laneInfo.length?
      `<span class="step-lane-mini">${s.laneInfo.filter(l=>l.valid||l.active).length||'?'} valid lane(s)</span>`:'';
    const done=i<activeStepIdx?' done-step':'';
    const active=i===activeStepIdx?' active-step':'';
    return`<div class="step${active}${done}" id="step-${i}" onclick="jumpToStep(${i})">
      <div class="step-icon">${signArrow(s.sign)}</div>
      <div class="step-body">
        <div class="step-text">${s.text}</div>
        <div class="step-meta"><span class="step-dist">${dist}</span>${road}${lm}</div>
      </div>
    </div>`;
  }).join('');
}

function updateNavBox(idx){
  if(!currentRoute) return;
  const steps=currentRoute.steps;
  if(idx<0||idx>=steps.length) return;
  const s=steps[idx];
  document.getElementById('nav-box').style.display='block';
  document.getElementById('nav-direction').textContent=signArrow(s.sign);
  document.getElementById('nav-street').textContent=s.streetName||s.text.split(' onto ').pop()||'—';
  document.getElementById('nav-detail').textContent=s.text;
  const dist=s.distance>=1000?(s.distance/1000).toFixed(1)+' km':(Math.round(s.distance)+' m');
  document.getElementById('nav-dist').textContent=dist;
  const lane=document.getElementById('nav-lane');
  lane.innerHTML=renderLanesHTML(s.laneInfo,'lane-arrow');
  const rt=fmtRoadType(s.roadType);
  if(rt) lane.innerHTML+=`<span style="font-size:10px;color:#5a6080;margin-left:4px">${rt}</span>`;

  // Update HUD too
  document.getElementById('hud-arrow').textContent=signArrow(s.sign);
  document.getElementById('hud-street').textContent=s.streetName||'—';
  document.getElementById('hud-detail').textContent=s.text;
  document.getElementById('hud-in').textContent=dist;
  document.getElementById('hud-lane').innerHTML=renderLanesHTML(s.laneInfo,'h-lane');

  // Next step preview
  const next=steps[idx+1];
  const nextEl=document.getElementById('hud-next');
  if(next&&next.sign!==4){
    nextEl.style.display='block';
    nextEl.innerHTML=`Then: <strong>${signArrow(next.sign)} ${next.streetName||next.text.substring(0,30)}</strong>`;
  } else {
    nextEl.style.display='none';
  }

  // Remaining distance
  const remDist=steps.slice(idx).reduce((a,st)=>a+st.distance,0);
  const remKm=(remDist/1000).toFixed(1);
  document.getElementById('hud-total').textContent=`${remKm} km left`;

  // Steps list highlight
  document.querySelectorAll('.step').forEach((el,i)=>{
    el.classList.toggle('active-step',i===idx);
    el.classList.toggle('done-step',i<idx);
  });
  const el=document.getElementById('step-'+idx);
  if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function jumpToStep(i){
  activeStepIdx=i;
  updateNavBox(i);
  if(voiceOn) speakStep(currentRoute.steps[i]);
}

// ═══════════════════════════════════════
//  LIVE TRACKING ENGINE
// ═══════════════════════════════════════
function haversine(a,b){
  const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function distToPolyline(pos,coords){
  let minDist=Infinity, minIdx=0;
  for(let i=0;i<coords.length-1;i++){
    const d=distToSegment(pos,coords[i],coords[i+1]);
    if(d<minDist){minDist=d;minIdx=i;}
  }
  return{dist:minDist,idx:minIdx};
}

function distToSegment(p,a,b){
  const dx=b[1]-a[1],dy=b[0]-a[0];
  if(dx===0&&dy===0) return haversine({lat:p.lat,lng:p.lng},{lat:a[0],lng:a[1]});
  let t=((p.lat-a[0])*dy+(p.lng-a[1])*dx)/(dy*dy+dx*dx);
  t=Math.max(0,Math.min(1,t));
  return haversine({lat:p.lat,lng:p.lng},{lat:a[0]+t*dy,lng:a[1]+t*dx});
}

function startTracking(){
  if(!navigator.geolocation){setStatus('Geolocation not supported','#ef4444');return;}
  if(isTracking){stopTracking();return;}

  isTracking=true;
  const btn=document.getElementById('btn-drive');
  btn.textContent='⏹ Stop';
  btn.classList.add('tracking');
  document.getElementById('hud').style.display='flex';
  document.getElementById('gps-dot').classList.add('active');
  setStatus('Live tracking active — following your position.','#4ade80');

  watchId=navigator.geolocation.watchPosition(onPosition,onGPSError,{
    enableHighAccuracy:true,maximumAge:2000,timeout:10000
  });
}

function stopTracking(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
  isTracking=false;
  const btn=document.getElementById('btn-drive');
  btn.textContent='▶ Drive';
  btn.classList.remove('tracking');
  document.getElementById('hud').style.display='none';
  document.getElementById('gps-dot').classList.remove('active');
  document.getElementById('offroute-banner').style.display='none';
  if(posMarker){map.removeLayer(posMarker);posMarker=null;}
  setStatus('Tracking stopped.');
}

async function onPosition(pos){
  const ll={lat:pos.coords.latitude,lng:pos.coords.longitude};
  const speedKmh=pos.coords.speed!=null?Math.round(pos.coords.speed*3.6):null;
  const heading=pos.coords.heading;

  // Update speed display
  document.getElementById('hud-spd-val').textContent=speedKmh!==null?speedKmh:'—';

  // Update position marker
  if(posMarker) map.removeLayer(posMarker);
  posMarker=L.marker([ll.lat,ll.lng],{icon:posIcon(heading||0),zIndexOffset:1000}).addTo(map);

  // Accumulate distance
  if(lastPos) distTravelled+=haversine(lastPos,ll);
  lastPos=ll;

  if(!currentRoute) return;

  // Find nearest point on route
  const {dist,idx}=distToPolyline(ll,currentRoute.coords);

  // Check off-route
  const banner=document.getElementById('offroute-banner');
  if(dist>OFFROUTE_THRESHOLD){
    banner.style.display='block';
    const now=Date.now();
    if(now-lastReroute>REROUTE_COOLDOWN){
      lastReroute=now;
      banner.textContent='⚠ Off route — recalculating…';
      if(voiceOn) speak('Recalculating route');
      try{
        const result=await getRoute(ll,endLatLng);
        startLatLng=L.latLng(ll.lat,ll.lng);
        drawRoute(result);
        banner.style.display='none';
      }catch(e){banner.textContent='⚠ Could not recalculate: '+e.message;}
    }
    return;
  }
  banner.style.display='none';

  // Auto-advance steps based on proximity to next step's point
  if(currentRoute.steps&&activeStepIdx<currentRoute.steps.length-1){
    const nextStep=currentRoute.steps[activeStepIdx+1];
    const nextPt=currentRoute.coords[nextStep.pointIndex]||currentRoute.coords[nextStep.interval?.[0]]||currentRoute.coords[Math.min(nextStep.interval?.[1]||0,currentRoute.coords.length-1)];
    if(nextPt){
      const distToNext=haversine(ll,{lat:nextPt[0],lng:nextPt[1]});
      if(distToNext<STEP_ARRIVE_THRESHOLD){
        activeStepIdx++;
        updateNavBox(activeStepIdx);
        if(voiceOn) speakStep(currentRoute.steps[activeStepIdx]);
      }
    }
  }

  // Check arrival
  const destDist=haversine(ll,{lat:endLatLng.lat,lng:endLatLng.lng});
  if(destDist<40){
    setStatus('🎉 You have arrived at your destination!','#4ade80');
    if(voiceOn) speak('You have arrived at your destination');
    stopTracking();
    return;
  }

  // Re-centre map on position (keep heading up if we have it)
  map.setView([ll.lat,ll.lng],16,{animate:true,duration:.8});
}

function onGPSError(err){
  setStatus('GPS error: '+err.message,'#ef4444');
  document.getElementById('gps-dot').classList.remove('active');
}

function speak(txt){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='en-CA'; u.rate=1.05;
  u.onstart=()=>document.getElementById('voice-indicator').style.display='block';
  u.onend=u.onerror=()=>document.getElementById('voice-indicator').style.display='none';
  window.speechSynthesis.speak(u);
}

document.getElementById('btn-drive').addEventListener('click',()=>{
  if(!currentRoute){setStatus('Plan a route first, then click Drive.','#f59e0b');return;}
  if(isTracking) stopTracking();
  else startTracking();
});

// ═══════════════════════════════════════
//  GEOCODE
// ═══════════════════════════════════════
async function geocode(q){
  q=q.trim();
  if(/^-?\d+\.?\d*\s*,\s*-?\d+\.?\d*$/.test(q)){const[a,b]=q.split(',').map(Number);return{lat:a,lng:b};}
  const url=`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+', Ontario, Canada')}&format=json&limit=1`;
  const d=await(await fetch(url,{headers:{'Accept-Language':'en','User-Agent':'OntarioGPS/3.0'}})).json();
  if(!d.length) throw new Error(`Not found: "${q}"`);
  return{lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};
}

// ═══════════════════════════════════════
//  MAP CLICKS
// ═══════════════════════════════════════
map.on('click',async e=>{
  if(isTracking) return;
  if(clickState===0){placeStart(e.latlng);clickState=1;setStatus('Start set ✓ — now click your destination.');}
  else if(clickState===1){placeEnd(e.latlng);clickState=2;await runRoute();}
  else{clearAll();placeStart(e.latlng);clickState=1;setStatus('Start reset. Click destination.');}
});

function placeStart(ll){
  if(startMarker) map.removeLayer(startMarker);
  startLatLng=ll;
  startMarker=L.marker(ll,{icon:makeIcon('#22c55e','A'),draggable:true}).addTo(map).bindTooltip('Start');
  startMarker.on('dragend',async e=>{startLatLng=e.target.getLatLng();if(endLatLng) await runRoute();});
  document.getElementById('from').value=`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;
}
function placeEnd(ll){
  if(endMarker) map.removeLayer(endMarker);
  endLatLng=ll;
  endMarker=L.marker(ll,{icon:makeIcon('#ef4444','B'),draggable:true}).addTo(map).bindTooltip('End');
  endMarker.on('dragend',async e=>{endLatLng=e.target.getLatLng();if(startLatLng) await runRoute();});
  document.getElementById('to').value=`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;
}

// ═══════════════════════════════════════
//  RUN ROUTE
// ═══════════════════════════════════════
async function runRoute(){
  if(!startLatLng||!endLatLng){setStatus('Set both start and end first.','#f59e0b');return;}
  try{const r=await getRoute(startLatLng,endLatLng);drawRoute(r);}
  catch(e){setStatus('Route error: '+e.message,'#ef4444');}
}

// ═══════════════════════════════════════
//  CLEAR
// ═══════════════════════════════════════
function clearAll(){
  stopTracking();
  if(startMarker){map.removeLayer(startMarker);startMarker=null;}
  if(endMarker){map.removeLayer(endMarker);endMarker=null;}
  if(routeLayer){map.removeLayer(routeLayer);routeLayer=null;}
  if(posMarker){map.removeLayer(posMarker);posMarker=null;}
  startLatLng=null;endLatLng=null;clickState=0;currentRoute=null;lastPos=null;
  document.getElementById('from').value='';
  document.getElementById('to').value='';
  document.getElementById('steps').innerHTML='';
  document.getElementById('summary').style.display='none';
  document.getElementById('nav-box').style.display='none';
  document.getElementById('hud').style.display='none';
  document.getElementById('offroute-banner').style.display='none';
  renderFavSaveBtn();
  window.speechSynthesis?.cancel();
  setStatus('Cleared. Click the map to set your start point.');
}

// ═══════════════════════════════════════
//  BUTTONS
// ═══════════════════════════════════════
document.getElementById('btn-route').addEventListener('click',async()=>{
  const fv=document.getElementById('from').value.trim();
  const tv=document.getElementById('to').value.trim();
  if(!fv||!tv){setStatus('Enter both addresses.','#f59e0b');return;}
  try{
    setStatus('Geocoding…','#7eb8f7');
    const[s,e]=await Promise.all([geocode(fv),geocode(tv)]);
    placeStart(L.latLng(s.lat,s.lng));placeEnd(L.latLng(e.lat,e.lng));clickState=2;
    await runRoute();
  }catch(ex){setStatus(ex.message,'#ef4444');}
});

document.getElementById('btn-clear').addEventListener('click',clearAll);

document.getElementById('btn-locate').addEventListener('click',()=>{
  if(!navigator.geolocation){setStatus('Geolocation not supported','#ef4444');return;}
  setStatus('Getting your location…','#7eb8f7');
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=L.latLng(p.coords.latitude,p.coords.longitude);
    map.setView(ll,14);placeStart(ll);clickState=1;
    setStatus('Location set as start. Click or type destination.');
  },err=>setStatus('Location error: '+err.message,'#ef4444'));
});

document.querySelectorAll('input[type=text]').forEach(i=>{
  i.addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('btn-route').click();});
});

// Arrow keys step through turns
document.addEventListener('keydown',e=>{
  if(!currentRoute||isTracking) return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){const n=Math.min(activeStepIdx+1,currentRoute.steps.length-1);jumpToStep(n);activeStepIdx=n;}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){const n=Math.max(activeStepIdx-1,0);jumpToStep(n);activeStepIdx=n;}
});

// ═══════════════════════════════════════
//  FAVOURITES
// ═══════════════════════════════════════
function loadFavs(){try{favourites=JSON.parse(localStorage.getItem('ont_gps_favs')||'[]');}catch{favourites=[];}}
function saveFavs(){try{localStorage.setItem('ont_gps_favs',JSON.stringify(favourites));}catch{}}
loadFavs();

function renderFavList(){
  const el=document.getElementById('fav-list');
  if(!favourites.length){el.innerHTML='<div id="no-favs">No favourites yet.<br>Route somewhere and save it!</div>';return;}
  el.innerHTML=favourites.map((f,i)=>`
    <div class="fav-item">
      <div class="fav-info">
        <div class="fav-name">⭐ ${f.name}</div>
        <div class="fav-addr">From: ${f.fromLabel}</div>
        <div class="fav-addr">To: ${f.toLabel}</div>
      </div>
      <button class="fav-use" onclick="loadFav(${i})">Go</button>
      <button class="fav-del" onclick="deleteFav(${i})" title="Delete">✕</button>
    </div>`).join('');
}

function renderFavSaveBtn(){
  document.getElementById('btn-open-save').style.display=currentRoute?'block':'none';
}

document.getElementById('btn-open-save').addEventListener('click',()=>{
  document.getElementById('fav-save-area').style.display='block';
  const tv=document.getElementById('to').value.trim();
  document.getElementById('fav-name-input').value=tv?tv.split(',')[0]:'My Route';
  document.getElementById('fav-name-input').focus();
});
document.getElementById('btn-cancel-fav').addEventListener('click',()=>{
  document.getElementById('fav-save-area').style.display='none';
});
document.getElementById('btn-save-fav').addEventListener('click',()=>{
  if(!currentRoute){alert('No route to save.');return;}
  const name=document.getElementById('fav-name-input').value.trim()||'Saved Route';
  favourites.unshift({name,
    fromLabel:document.getElementById('from').value.trim()||`${startLatLng.lat.toFixed(4)},${startLatLng.lng.toFixed(4)}`,
    toLabel:document.getElementById('to').value.trim()||`${endLatLng.lat.toFixed(4)},${endLatLng.lng.toFixed(4)}`,
    fromLL:{lat:startLatLng.lat,lng:startLatLng.lng},
    toLL:{lat:endLatLng.lat,lng:endLatLng.lng}});
  saveFavs();renderFavList();
  document.getElementById('fav-save-area').style.display='none';
  setStatus(`Saved "${name}" to favourites.`,'#4ade80');
});

async function loadFav(i){
  const f=favourites[i];
  document.getElementById('from').value=f.fromLabel;
  document.getElementById('to').value=f.toLabel;
  placeStart(L.latLng(f.fromLL.lat,f.fromLL.lng));
  placeEnd(L.latLng(f.toLL.lat,f.toLL.lng));
  clickState=2;switchTab('directions');
  await runRoute();
}
function deleteFav(i){
  if(!confirm(`Delete "${favourites[i].name}"?`)) return;
  favourites.splice(i,1);saveFavs();renderFavList();
}

// ═══════════════════════════════════════
//  TABS
// ═══════════════════════════════════════
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.getElementById('tab-directions').classList.toggle('hidden',name!=='directions');
  document.getElementById('tab-favourites').classList.toggle('hidden',name!=='favourites');
  if(name==='favourites') renderFavList();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

// Init
renderFavList();
renderFavSaveBtn();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/ontario-gps/sw.js', {scope: '/ontario-gps/'})
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
